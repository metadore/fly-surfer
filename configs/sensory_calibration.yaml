# FLY-SURFER Phase 3A.5 sensory-calibration configuration.
#
# This file only parameterises the existing Phase 3A encoders, mapping,
# scheduler and simulator. It does not define a new neuron or synapse model.
#
# All reported activity is simulated model output. Activation is a
# dimensionless configured drive, current is pA, and no value here is a
# measured biological quantity.

calibration:
  base_config: configs/sensory_config.yaml
  output_dir: experiments/phase_3_5
  duration_ms: 300.0

  # The calibrated feature is the obstacle-distance population. Other
  # populations remain at their Phase 3A settings and are used only as
  # controls.
  feature: obstacle_distance

  current_amplitudes_pa: [100.0, 125.0, 150.0, 175.0, 200.0, 225.0, 250.0, 300.0]
  sigma_fractions: [0.05, 0.10, 0.20, 0.30, 0.50]
  population_sizes: [4, 8, 12, 16, 24]
  baseline_activations: [0.0, 0.10, 0.20]
  transitions_ms: [0.0, 10.0, 25.0, 50.0, 100.0]
  distances: [0.15, 0.55, 0.90]

  mapping_seed: 20261104
  extra_mapping_seeds: [20261105, 20261106]

  # Used only when no ordered operating point is found, or when a stage is
  # run before its prerequisite stage. The fallback is the Phase 3A reference.
  default_amplitude_pa: 200.0
  default_sigma_fraction: 0.20
  default_population_size: 12
  default_baseline: 0.0

  additivity:
    obstacle_distance: 0.30
    coin_distance: 0.30

  transition_sequence:
    far_distance: 0.90
    near_distance: 0.15
    switch_ms: 150.0

  controls:
    # The 100 pA and 300 pA obstacle-distance controls are already present in
    # the amplitude sweep. Coin and speed controls are added explicitly.
    feature_controls:
      coin_distance: {distance: 0.30, amplitudes_pa: [100.0, 300.0]}
      player_speed: {speed: 0.50, amplitudes_pa: [100.0, 300.0]}

  selection:
    # A group is "ordered" only when the three distance levels produce a
    # strictly monotone spike-count sequence. Ties are not ordered.
    strict_monotonic: true
    saturation_fraction: 0.999
    min_total_spikes: 1
