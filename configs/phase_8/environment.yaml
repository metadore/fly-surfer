# FLY-SURFER Phase 8 — the single environment configuration.
#
# REV3 §6.1: this file is the only source for the controlled-game constants and
# is hashed into every episode record. No condition may override any of it.
#
# The values are the controlled game's own declared defaults, copied here so
# that the campaign configuration is self-contained and auditable. The loader
# checks them against the game object at campaign start; a mismatch is an
# error, not a silent override. None of the game files is modified.
#
# PROPOSED — the protocol is not approved (REV3 §12). Nothing here authorises
# a run while the memory preflight of §9.3 is below the gate.

schema_version: 1
name: phase_8_environment

max_steps: 900
initial_speed: 7.0
max_speed: 16.0
coin_reward: 1.0
collision_penalty: -1.0
survival_reward: 0.01
obstacle_reward: 0.0
distance_horizon: 25.0
render_mode: null
observation_schema_version: 1

# Declared, not measured: distances are normalised game-world units.
units: normalised_game_world_units

# Provenance of the reward scalar used by every condition (REV3 §6.5).
reward_classification: >-
  synthetic task reward defined by the controlled game's rules; not a
  biological dopamine, octopamine or serotonin measurement
