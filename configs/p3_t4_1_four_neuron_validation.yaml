# P3-T4.1 four-neuron calibration-point validation.
#
# This file is new. It fixes the comparison between the four-neuron
# obstacle-distance population selected in Phase 3A.5 and the frozen
# twelve-neuron population of configs/sensory_config.yaml BEFORE execution.
# Values must not be changed after results are seen; deviations are recorded
# in experiments/phase_3c/results/p3_t4_1_four_neuron_validation.json.
#
# Units: distances are the dimensionless image-geometry proxies used by the
# Phase 3A encoder, not metres. Times are milliseconds of simulated time.
phase: P3-T4.1
version: p3_t4_1_four_neuron_validation_v1
preregistered_at_utc: "2026-11-14T02:48:34+00:00"

# Population definitions. Only obstacle_distance changes between P4 and P12.
# The encoder unit count changes with the population because the frozen Phase
# 3A gaussian bank places `n_neurons` preferred stimuli on a linspace; the
# four-neuron point is therefore a different encoder bank, not a four-unit
# subset of the twelve-unit bank. This is part of the configuration under
# test and is reported as a confound, not corrected.
populations:
  P4:
    mapping_n_neurons: 4
    encoder_n_neurons: 4
    stimulated_cells: all_mapped
  P12:
    mapping_n_neurons: 12
    encoder_n_neurons: 12
    stimulated_cells: all_mapped
  P12S:
    mapping_n_neurons: 12
    encoder_n_neurons: 12
    stimulated_cells: four_neuron_mapping

protocol:
  # Values copied from configs/temporal_sensory.yaml (P3-T7) and asserted at
  # run time; this file does not redefine them.
  duration_ms: 600.5
  frame_interval_ms: 50.0
  bin_ms: 50.0
  obstacle_lane: center
  obstacle_type: low
  current_pa: 200.0
  sigma_fraction: 0.20
  baseline_pa: 0.0
  background_current_pa: 0.0
  noise_std_pa: 0.0
  max_recorded_spikes: 6000000
  # Only the distance population is activated. Player defaults and other
  # object features are held at no current so that unrelated mappings cannot
  # contribute current in either configuration.
  active_features: ["obstacle_distance"]
  voltage_sample_times_ms: [0.0, 100.0, 300.0, 600.0]

seeds:
  # The Phase 3A.5 calibration seed plus the two Phase 3C draws. Only the
  # mapping seed varies; the simulator is deterministic with zero noise.
  mapping: [20261104, 20261105, 20261106]
  base_mapping_seed: 20261104

conditions:
  # 3C.1 static distances at the 3C horizon.
  constant_distances: [0.15, 0.55, 0.90]
  # 3C.2 approach and retreat with identical endpoints, 50 ms frames.
  approach: [0.90, 0.15]
  retreat: [0.15, 0.90]
  # 3C.7 frame-rate comparison; the 50 ms rate is the approach condition.
  frame_rates_ms: [200, 100, 50]
  # Control with no obstacle present and no distance current.
  control_no_input: true

analysis:
  # Thresholds are copied from prior pre-registrations, not chosen here.
  # Strict-ordering replication follows Phase 3A.5 (ordered in >= 2 of 3
  # mapping seeds); d' and cosine thresholds follow configs/temporal_sensory.yaml.
  ordering_seeds_required: 2
  dprime_threshold: 1.0
  separability_seeds_required: 2
  cosine_distance_threshold: 0.01
  # Determinism check: rerun this condition once per population at this seed
  # and require an identical spike digest.
  determinism_condition: approach
  determinism_seed: 20261104

# Comparison roles fixed before execution.
comparisons:
  primary: P4_vs_P12
  decomposition:
    - P4_vs_P12S
    - P12S_vs_P12
  primary_metrics:
    - total_spikes
    - stimulated_spikes
    - stimulated_active_neurons
    - outside_spikes
    - distance_ordering_stimulated
    - approach_retreat_dprime_stimulated
  secondary_metrics:
    - outside_active_neurons
    - approach_retreat_dprime_network
    - approach_retreat_cosine_stimulated
    - frame_rate_current_rms_stimulated
    - frame_rate_profile_cosine_stimulated
    - first_stimulated_spike_latency_ms
    - voltage_summary_stimulated
    - voltage_summary_outside
    - per_neuron_stimulated_counts
